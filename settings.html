<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | ComicVault</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('rajComics.settings')).theme==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'rgb(var(--ink) / <alpha-value>)',panel:'rgb(var(--panel) / <alpha-value>)',edge:'rgb(var(--edge) / <alpha-value>)',fg:'rgb(var(--fg) / <alpha-value>)',muted:'rgb(var(--muted) / <alpha-value>)',subtle:'rgb(var(--subtle) / <alpha-value>)',gold:'rgb(var(--gold) / <alpha-value>)','on-gold':'rgb(var(--on-gold) / <alpha-value>)',brand:'#e63946'},fontFamily:{display:['"Bebas Neue"','Impact','sans-serif']}}}}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body class="flex min-h-screen flex-col bg-ink text-fg">
<div id="app-header" data-page="settings"></div>
<main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6">
  <h1 class="font-display text-5xl tracking-wide">Settings</h1>
  <p class="text-muted">Changes save automatically and apply across the library and the viewer. They are stored in this browser only.</p>
  <p id="warn" class="mt-3 hidden rounded border border-gold/50 bg-gold/10 p-3 text-sm text-gold" role="alert">Browser storage is unavailable, so settings will not be remembered after you close this page.</p>
  <div id="cards" class="mt-6 space-y-6"></div>
  <p id="status" class="mt-4 h-5 text-sm text-gold" role="status" aria-live="polite"></p>
</main>
<dialog id="dlg" class="w-[min(28rem,calc(100vw-2rem))] rounded-lg border border-edge bg-panel p-6 text-fg backdrop:bg-black/60">
  <h2 id="dlgTitle" class="font-display text-2xl tracking-wide"></h2>
  <p id="dlgText" class="mt-2 text-sm text-muted"></p>
  <div class="mt-5 flex justify-end gap-2">
    <button id="dlgNo" type="button" class="rounded border border-edge px-4 py-2">Cancel</button>
    <button id="dlgYes" type="button" class="rounded bg-brand px-4 py-2 text-white">Confirm</button>
  </div>
</dialog>
<div id="app-footer"></div>
<script src="js/common.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
